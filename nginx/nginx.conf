# Balanceador. El puerto 80 es la entrada publica y reparte entre las replicas
# de ingreso; el 81 expone admision para los scripts.
#
# Es una plantilla: ${THROTTLE_TASA} y ${THROTTLE_RAFAGA} salen del .env.

events {
    # La demo de cola abre hasta ~500 conexiones concurrentes mas las de
    # sondeo; con 1024 el balanceador era el primer cuello de botella.
    worker_connections 4096;
}

http {
    access_log off;

    # Throttling: limite por IP de cliente; el exceso recibe 429.
    limit_req_zone $binary_remote_addr zone=por_cliente:10m rate=${THROTTLE_TASA};
    limit_req_status 429;

    server {
        listen 80;

        location / {
            limit_req zone=por_cliente burst=${THROTTLE_RAFAGA} nodelay;
            error_page 429 = @demasiadas_solicitudes;

            resolver 127.0.0.11 valid=2s ipv6=off;
            set $destino "ingreso:8000";
            proxy_pass http://$destino$request_uri;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location @demasiadas_solicitudes {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"detail":"demasiadas solicitudes: se supero el limite de ${THROTTLE_TASA} por cliente"}';
        }
    }

    server {
        listen 81;
        location / {
            resolver 127.0.0.11 valid=2s ipv6=off;
            set $destino "admision:8000";
            proxy_pass http://$destino$request_uri;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }

    # Ingreso sin throttling, solo dentro de Docker. Lo usan las demos de carga.
    server {
        listen 82;
        location / {
            resolver 127.0.0.11 valid=2s ipv6=off;
            set $destino "ingreso:8000";
            proxy_pass http://$destino$request_uri;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
